name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Version tags reuse the image main already built (see promote)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ghcr.io requires a lowercase image name (owner is "rangoDJ")
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=ConnectHub
            org.opencontainers.image.description=ConnectHub - browser-based remote desktop gateway for RDP, VNC and SSH

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # For vX.Y.Z tags: add version tags to the image main already built for this
  # commit instead of rebuilding it, so the release ships exactly that image
  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the existing image with the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          source="${image}:sha-${GITHUB_SHA::7}"
          version="${TAG#v}"

          if ! docker buildx imagetools inspect "$source" > /dev/null 2>&1; then
            echo "::error::No image for this commit ($source). Push the commit to main, wait for its build to finish, then push the tag."
            exit 1
          fi

          tags=(-t "${image}:${version}")
          # Pre-releases (v1.2.0-rc.1) don't move the X.Y tag
          if [[ "$version" != *-* ]]; then
            tags+=(-t "${image}:${version%.*}")
          fi
          docker buildx imagetools create "${tags[@]}" "$source"

  # Runs only after the versioned image is published, so a release never
  # points at an image that doesn't exist
  release:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          # Tags like v1.2.0-rc.1 are published as pre-releases
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi

          cat > notes.md <<EOF
          ## Docker image

          \`\`\`bash
          docker pull ${image}:${version}
          \`\`\`

          Available for \`linux/amd64\` and \`linux/arm64\`.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ConnectHub $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            $prerelease
