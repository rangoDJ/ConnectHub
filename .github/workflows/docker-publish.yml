name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every merge to main is a release, so main runs queue instead of cancelling
  # each other; PR and tag runs still cancel superseded ones
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Merges to main get the next version, bumped according to the merged PR
  # (.github/scripts/next-version.sh). PR and manual runs get none.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags

      - name: Compute next version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1 || true)
          # The PR this merge commit belongs to; empty for a direct push
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                 --jq '.[0] // empty | [.head.ref, ([.labels[].name] | join(","))] | @tsv')
          IFS=$'\t' read -r branch labels <<< "$pr" || true
          version=$(bash .github/scripts/next-version.sh "$latest" "$branch" "$labels")
          echo "${latest:-no tag} -> v${version} (branch: ${branch:-none}, labels: ${labels:-none})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Version tags reuse the image main already built (see promote). version is
    # skipped outside main, which must not stop PR and manual builds.
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/v') && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ghcr.io requires a lowercase image name (owner is "rangoDJ")
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=ConnectHub
            org.opencontainers.image.description=ConnectHub - browser-based remote desktop gateway for RDP, VNC and SSH

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version || format('0.0.0-dev+{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # For vX.Y.Z tags: add version tags to the image main already built for this
  # commit instead of rebuilding it, so the release ships exactly that image
  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the existing image with the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          source="${image}:sha-${GITHUB_SHA::7}"
          version="${TAG#v}"

          if ! docker buildx imagetools inspect "$source" > /dev/null 2>&1; then
            echo "::error::No image for this commit ($source). Push the commit to main, wait for its build to finish, then push the tag."
            exit 1
          fi

          tags=(-t "${image}:${version}")
          # Pre-releases (v1.2.0-rc.1) don't move the X.Y tag
          if [[ "$version" != *-* ]]; then
            tags+=(-t "${image}:${version%.*}")
          fi
          docker buildx imagetools create "${tags[@]}" "$source"

  # Runs only after the versioned image is published, so a release never
  # points at an image that doesn't exist: after build for a merge to main,
  # after promote for a hand-pushed tag
  release:
    needs: [version, build, promote]
    if: >-
      !cancelled() && (needs.promote.result == 'success'
      || (needs.build.result == 'success' && needs.version.outputs.version != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          # Tags like v1.2.0-rc.1 are published as pre-releases
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi

          cat > notes.md <<EOF
          ## Docker image

          \`\`\`bash
          docker pull ${image}:${version}
          \`\`\`

          Available for \`linux/amd64\` and \`linux/arm64\`.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ConnectHub $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --target "$GITHUB_SHA" \
            $prerelease
