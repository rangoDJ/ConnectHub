# Single server block serves both listeners: nginx applies the "ssl" parameter
# per-listen, so 3000 stays plaintext and 3001 is TLS with the self-signed cert.
# Keeping one block avoids the two drifting apart when a location is added.
server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    listen 3001 ssl;
    listen [::]:3001 ssl;
    ssl_certificate /config/ssl/cert.pem;
    ssl_certificate_key /config/ssl/cert.key;

    server_name _;
    client_max_body_size 2048M;
    absolute_redirect off;

    # SameSite=Lax on the session cookie covers CSRF, but not framing: without this a
    # third-party page could iframe the UI and land clicks on disconnect/delete.
    # The app only frames its own /stream/, so SAMEORIGIN costs nothing.
    # add_header does not inherit into a location that sets its own -- keep these the
    # only add_header directives in this file.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login {
        return 302 /login.html;
    }

    # The frontend files carry no version in their URLs, so they are revalidated on every
    # load ("expires epoch" sends Cache-Control: no-cache): unchanged files cost a 304, and
    # an update takes effect at once. Without it browsers cached them by guesswork and
    # Cloudflare for 4 hours, running the old JavaScript against the new server.
    # ("expires" is not add_header, so the security headers above still apply.)
    location = /login.html {
        root /app/frontend;
        expires epoch;
    }

    location /css/ {
        root /app/frontend;
        expires epoch;
    }

    location /js/ {
        root /app/frontend;
        expires epoch;
    }

    location / {
        auth_request /_auth_verify;
        error_page 401 = @login;
        root /app/frontend;
        index index.html;
        try_files $uri /index.html;
        expires epoch;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # What a proxy in front of us received; the backend only believes it from TRUSTED_PROXIES
        proxy_set_header X-Proxy-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /stream/ {
        auth_request /_auth_verify;
        error_page 401 = @login;
        alias /usr/share/selkies/web/;
        # The Selkies client, patched by ConnectHub: same reason as the frontend above
        expires epoch;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Selkies 2 puts every server endpoint under "<page dir>/api/" (websockets, signaling,
    # upload, turn, print). The client page is served at /stream/, so strip that prefix
    # and hand the rest to the Selkies server, which expects /api/... at its root.
    location /stream/api/ {
        auth_request /_auth_verify;
        rewrite ^/stream(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:CWS;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
